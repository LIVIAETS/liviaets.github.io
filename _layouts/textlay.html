<!DOCTYPE html>
<html lang="en">

  {% include head.html %}

  <body>

    {% include header.html %}

    <main id="main">

      <section class="page-hero">
        <div class="wrap">
          <div class="reveal">
            {% if page.kicker %}<div class="kicker">{{ page.kicker }}</div>{% endif %}
            <h1 style="margin-bottom:10px;">{{ page.heading | default: page.title }}</h1>
            {% if page.subtitle %}<p style="color:var(--muted);max-width:60ch;">{{ page.subtitle }}</p>{% endif %}
          </div>
        </div>
      </section>

      <div class="wrap">
        <div class="prose reveal">
          {{ content }}
        </div>
      </div>

    </main>

    {% include footer.html %}

  </body>

</html>
