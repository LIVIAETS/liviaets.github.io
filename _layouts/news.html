<!DOCTYPE html>
<html lang="en">

  {% include head.html %}

  <body>

    {% include header.html %}

    <main id="main">

      <section class="page-hero">
        <div class="wrap">
          <div class="reveal">
            <div class="kicker">Newsroom</div>
            <h1 style="margin-bottom:0;">News &amp; Highlights</h1>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="wrap">
          <div class="grid reveal" style="gap:14px;">
            {% for article in site.data.news %}
            <div class="news-card">
              <div class="date">{{ article.date }}</div>
              <p>{{ article.headline }}</p>
            </div>
            {% endfor %}
          </div>
        </div>
      </section>

    </main>

    {% include footer.html %}

  </body>

</html>
